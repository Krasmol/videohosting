{% extends "base.html" %}
{% block title %}Поиск — ZTUBE{% endblock %}
{% block content %}
<div class="container" style="padding-top:2rem;">
    <div class="search-header" style="margin-bottom:2rem;">
        <h1 style="font-size:1.8rem;font-weight:700;margin-bottom:1rem;">
            Результаты поиска: <span id="searchQuery" style="color:var(--primary);"></span>
        </h1>
        <div class="search-filters" style="display:flex;gap:1rem;align-items:center;">
            <select id="categoryFilter" onchange="loadSearchResults()" style="padding:0.5rem 1rem;background:var(--glass);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:0.9rem;">
                <option value="all">Все категории</option>
                <option value="gaming">Игры</option>
                <option value="music">Музыка</option>
                <option value="education">Образование</option>
                <option value="entertainment">Развлечения</option>
                <option value="tech">Технологии</option>
                <option value="sports">Спорт</option>
                <option value="news">Новости</option>
                <option value="blog">Блог</option>
                <option value="other">Другое</option>
            </select>
        </div>
    </div>

    <div class="video-grid" id="searchResults">
        <div class="loading"><i class="fas fa-spinner fa-spin"></i> Поиск...</div>
    </div>

    <div id="noResults" style="display:none;">
        <div class="empty-state">
            <i class="fas fa-search" style="font-size:4rem;color:rgba(255,255,255,0.2);margin-bottom:1rem;"></i>
            <h3>Ничего не найдено</h3>
            <p>Попробуйте изменить запрос или выбрать другую категорию</p>
        </div>
    </div>
</div>

<script>
let currentQuery = '';

document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    currentQuery = params.get('q') || '';

    if (!currentQuery) {
        window.location.href = '/';
        return;
    }

    document.getElementById('searchQuery').textContent = currentQuery;
    document.getElementById('searchInput').value = currentQuery;

    loadSearchResults();
});

async function loadSearchResults() {
    const category = document.getElementById('categoryFilter').value;
    const resultsDiv = document.getElementById('searchResults');
    const noResultsDiv = document.getElementById('noResults');

    resultsDiv.style.display = 'grid';
    noResultsDiv.style.display = 'none';
    resultsDiv.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Поиск...</div>';

    try {
        let url = `/api/videos/search?q=${encodeURIComponent(currentQuery)}`;
        if (category !== 'all') {
            url += `&category=${category}`;
        }

        const response = await fetch(url);
        if (!response.ok) {
            throw new Error('Search failed');
        }

        const videos = await response.json();

        if (videos.length === 0) {
            resultsDiv.style.display = 'none';
            noResultsDiv.style.display = 'block';
        } else {
            renderSearchResults(videos);
        }
    } catch (error) {
        resultsDiv.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>Ошибка поиска</h3><p>Попробуйте позже</p></div>';
    }
}

function renderSearchResults(videos) {
    const resultsDiv = document.getElementById('searchResults');
    const cats = {
        gaming: 'Игры',
        music: 'Музыка',
        education: 'Образование',
        entertainment: 'Развлечения',
        tech: 'Технологии',
        sports: 'Спорт',
        news: 'Новости',
        blog: 'Блог',
        other: 'Другое'
    };

    resultsDiv.innerHTML = videos.map(v => {
        const dur = formatDuration(v.duration);
        return `
            <div class="video-card" onclick="window.location.href='/video/${v.id}'">
                <div class="video-thumbnail">
                    ${v.thumbnail_url ?
                        `<img src="${v.thumbnail_url}" alt="">` :
                        '<i class="fas fa-play-circle" style="color:rgba(255,255,255,0.3);font-size:3rem;"></i>'
                    }
                    <div class="play-overlay">
                        <i class="fas fa-play" style="color:white;font-size:1.5rem;margin-left:4px;"></i>
                    </div>
                    <span class="duration-badge">${dur}</span>
                    ${v.access_level !== 'public' ?
                        `<span class="video-badge">${v.access_level === 'sponsor' ? '💎' : '🔒'}</span>` :
                        ''
                    }
                </div>
                <div class="video-info">
                    <h3 class="video-title">${escapeHtml(v.title)}</h3>
                    <div class="video-meta">
                        <span>${v.views_count || 0} <i class="fas fa-eye"></i></span>
                        <span>${v.likes_count || 0} <i class="fas fa-thumbs-up"></i></span>
                        <span>${cats[v.category] || ''}</span>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function formatDuration(s) {
    if (!s) return '0:00';
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    return m + ':' + String(sec).padStart(2, '0');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
